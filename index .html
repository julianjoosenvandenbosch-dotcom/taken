<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17293A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taken">
<title>Takenlijst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1F4; --surface:#fff; --ink:#17293A; --muted:#6A7F90;
    --line:#D5DEE5; --accent:#0E7C66; --alert:#A93B26; --amber:#B9821C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Public Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 14px 60px}
  input,button{font:inherit;color:inherit}
  input{background:#fff}
  button{cursor:pointer;background:none;border:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .datum{font-family:'Newsreader',Georgia,serif;font-size:26px;line-height:1.2;margin:0}
  .balkrij{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:14px;color:var(--muted)}
  .streak{color:var(--muted)}
  .streak.aan{color:var(--amber)}
  .balk{height:4px;background:var(--line);margin-top:8px}
  .balk > i{display:block;height:4px;background:var(--accent);transition:width .2s ease}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .kaart{background:var(--surface);border:1px solid var(--line);margin-top:18px}
  .invoer{display:flex;align-items:center;gap:6px;padding:8px}
  .invoer input{flex:1;min-width:0;border:none;padding:10px 8px;outline:none}
  .knop-toe{background:var(--ink);color:#fff;padding:10px 12px;font-size:14px}
  .knop-meer{color:var(--muted);padding:10px 6px;font-size:14px}
  .details{display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-top:1px solid var(--line)}
  .details input{border:1px solid var(--line);padding:6px 8px;font-size:14px;min-width:0}
  .details input[type=text]{flex:1}
  .groep{display:flex;border:1px solid var(--line)}
  .groep button{padding:6px 10px;font-size:14px;color:var(--muted)}
  .groep button[data-aan="1"]{color:#fff}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .chip{border:1px solid var(--line);color:var(--muted);padding:5px 10px;font-size:14px}
  .chip[data-aan="1"]{border-color:var(--ink);color:var(--ink)}

  section{margin-top:26px}
  .kop{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:5px;font-size:14px;width:100%;text-align:left}
  .kop b{font-weight:600}
  .kop span{color:var(--muted)}
  .kop .rechts{margin-left:auto;color:var(--muted);font-weight:400}

  .taak{background:var(--surface);border-bottom:1px solid var(--line)}
  .rij{display:flex;gap:10px;align-items:flex-start;padding:10px 8px}
  .prio{width:3px;align-self:stretch;flex:none}
  .vink{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px}
  .vink[data-af="1"]{background:var(--accent);border-color:var(--accent)}
  .vink svg{display:block}
  .titel{flex:1;min-width:0;text-align:left}
  .titel .t{display:block;word-break:break-word}
  .titel .t[data-af="1"]{color:var(--muted);text-decoration:line-through}
  .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:3px}
  .meta .laat{color:var(--alert)}
  .pijl{color:var(--muted);padding:4px;flex:none;margin-top:2px}

  .paneel{border-top:1px solid var(--line);background:#FAFCFD;padding:12px 12px;display:flex;flex-direction:column;gap:12px}
  .paneel input{border:1px solid var(--line);padding:6px 8px;font-size:14px;min-width:0}
  .paneel .veldrij{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .paneel .veldrij input[type=text]{flex:1}
  .sub{display:flex;align-items:center;gap:8px;padding:4px 0}
  .subvink{width:18px;height:18px;flex:none;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .subvink[data-af="1"]{background:var(--accent);border-color:var(--accent)}
  .subtekst{flex:1;font-size:14px}
  .subtekst[data-af="1"]{color:var(--muted);text-decoration:line-through}
  .weg{color:var(--muted);padding:2px}
  .subtoe{display:flex;gap:8px;margin-top:4px}
  .subtoe input{flex:1}
  .subtoe button{border:1px solid var(--line);padding:6px 10px;font-size:14px}
  .verwijder{color:var(--alert);font-size:14px;text-align:left;padding:0}
  .leeg{text-align:center;color:var(--muted);font-size:14px;padding:40px 0}
  .weekkiezer{display:flex;align-items:center;border:1px solid var(--line)}
  .weekkiezer button{padding:6px 10px;color:var(--muted)}
  .weekkiezer span{padding:6px 2px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="datum" id="datum"></p>
    <div class="balkrij">
      <span id="voortgang"></span>
      <span class="streak" id="streak"></span>
    </div>
    <div class="balk"><i id="balk" style="width:0%"></i></div>
  </header>

  <div class="kaart">
    <div class="invoer">
      <input id="nieuw" type="text" placeholder="Wat moet er gebeuren?" enterkeyhint="done">
      <button class="knop-meer" id="meer">Meer</button>
      <button class="knop-toe" id="toevoegen">Zet erbij</button>
    </div>
    <div class="details" id="detailsvak" hidden></div>
  </div>

  <div class="chips" id="chips"></div>
  <div id="lijst"></div>
</div>

<script>
(function () {
  "use strict";

  var SLEUTEL = "taken:data";
  var PRIOS = {
    hoog: { label: "Hoog", kleur: "#A93B26", rang: 0 },
    normaal: { label: "Normaal", kleur: "#7E93A3", rang: 1 },
    laag: { label: "Laag", kleur: "#C3CED6", rang: 2 }
  };
  var GROEPEN = [
    { key: "telaat", titel: "Te laat", laat: true },
    { key: "vandaag", titel: "Vandaag" },
    { key: "morgen", titel: "Morgen" },
    { key: "week", titel: "Deze week" },
    { key: "volgende", titel: "Volgende week" },
    { key: "later", titel: "Later" },
    { key: "geen", titel: "Zonder datum" }
  ];

  /* ---------- opslag ---------- */
  var staat = { tasks: [], doneDates: [] };
  try {
    var ruw = localStorage.getItem(SLEUTEL);
    if (ruw) {
      var d = JSON.parse(ruw);
      staat.tasks = Array.isArray(d.tasks) ? d.tasks : [];
      staat.doneDates = Array.isArray(d.doneDates) ? d.doneDates : [];
    }
  } catch (e) {}

  function bewaar() {
    try { localStorage.setItem(SLEUTEL, JSON.stringify(staat)); } catch (e) {}
  }

  /* ---------- datum ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function sleutelVan(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function vandaag() { return sleutelVan(new Date()); }
  function uitSleutel(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function schuifDag(k, n) { var d = uitSleutel(k); d.setDate(d.getDate() + n); return sleutelVan(d); }
  function dagenTussen(a, b) { return Math.round((uitSleutel(b) - uitSleutel(a)) / 86400000); }

  function langeDatum(k) {
    var s = uitSleutel(k).toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function korteDatum(k) {
    var v = dagenTussen(vandaag(), k);
    if (v === 0) return "vandaag";
    if (v === 1) return "morgen";
    if (v === -1) return "gisteren";
    return uitSleutel(k).toLocaleDateString("nl-NL", { day: "numeric", month: "short" });
  }

  /* ---------- weken (ISO, maandag t/m zondag) ---------- */
  function weekVan(date) {
    var t = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3);
    var jaar = t.getFullYear();
    var jan4 = new Date(jaar, 0, 4);
    var eersteDo = new Date(jaar, 0, 4 - ((jan4.getDay() + 6) % 7) + 3);
    var nr = 1 + Math.round((t - eersteDo) / (7 * 86400000));
    return jaar + "-W" + pad(nr);
  }
  function maandagVan(k) {
    var p = k.split("-W").map(Number);
    var jan4 = new Date(p[0], 0, 4);
    var eersteMa = new Date(p[0], 0, 4 - ((jan4.getDay() + 6) % 7));
    var d = new Date(eersteMa);
    d.setDate(d.getDate() + (p[1] - 1) * 7);
    return d;
  }
  function schuifWeek(k, n) { var d = maandagVan(k); d.setDate(d.getDate() + n * 7); return weekVan(d); }
  function dezeWeek() { return weekVan(new Date()); }
  function weekNr(k) { return Number(k.split("-W")[1]); }
  function weekBereik(k) {
    var ma = maandagVan(k), zo = new Date(maandagVan(k));
    zo.setDate(zo.getDate() + 6);
    var zelfde = ma.getMonth() === zo.getMonth();
    var f = function (d, m) { return d.toLocaleDateString("nl-NL", m ? { day: "numeric", month: "short" } : { day: "numeric" }); };
    return f(ma, !zelfde) + "–" + f(zo, true);
  }
  function weekLang(k) { return "Week " + weekNr(k) + " · " + weekBereik(k); }
  function weekKort(k) {
    var nu = dezeWeek();
    if (k === nu) return "deze week";
    if (k === schuifWeek(nu, 1)) return "volgende week";
    if (k < nu) return "week " + weekNr(k) + " (voorbij)";
    return "week " + weekNr(k);
  }

  /* ---------- hulp ---------- */
  function id() { return Math.random().toString(36).slice(2, 10); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function taakVan(tid) {
    for (var i = 0; i < staat.tasks.length; i++) if (staat.tasks[i].id === tid) return staat.tasks[i];
    return null;
  }
  function groepVan(t) {
    var nu = dezeWeek();
    if (t.week) {
      if (t.week < nu) return "telaat";
      if (t.week === nu) return "week";
      if (t.week === schuifWeek(nu, 1)) return "volgende";
      return "later";
    }
    if (!t.due) return "geen";
    var v = dagenTussen(vandaag(), t.due);
    if (v < 0) return "telaat";
    if (v === 0) return "vandaag";
    if (v === 1) return "morgen";
    var w = weekVan(uitSleutel(t.due));
    if (w === nu) return "week";
    if (w === schuifWeek(nu, 1)) return "volgende";
    return "later";
  }
  function sorteerOp(t) { return t.due || (t.week ? sleutelVan(maandagVan(t.week)) : "9999-99-99"); }
  function isLaat(t) {
    if (t.done) return false;
    if (t.due) return dagenTussen(vandaag(), t.due) < 0;
    if (t.week) return t.week < dezeWeek();
    return false;
  }
  function streak() {
    var set = {}, i;
    for (i = 0; i < staat.doneDates.length; i++) set[staat.doneDates[i]] = true;
    var cur = vandaag();
    if (!set[cur]) cur = schuifDag(cur, -1);
    var n = 0;
    while (set[cur]) { n++; cur = schuifDag(cur, -1); }
    return n;
  }

  var VINK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var VINK_KLEIN = VINK.replace('width="12" height="12"', 'width="10" height="10"');
  var PRULLENBAK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';

  /* ---------- invoer bovenaan ---------- */
  var nieuw = { due: "", week: null, prio: "normaal", cat: "" };
  var detailsOpen = false;
  var filter = null;
  var openId = null;
  var afOpen = false;

  function prioKnoppen(huidig, actie) {
    var h = '<div class="groep">';
    ["hoog", "normaal", "laag"].forEach(function (p) {
      var aan = huidig === p;
      h += '<button data-actie="' + actie + '" data-prio="' + p + '" data-aan="' + (aan ? 1 : 0) + '"' +
        (aan ? ' style="background:' + PRIOS[p].kleur + '"' : "") + ">" + PRIOS[p].label + "</button>";
    });
    return h + "</div>";
  }

  function wanneerKiezer(due, week, actie) {
    var modus = week ? "week" : "dag";
    var h = '<div class="groep">' +
      '<button data-actie="' + actie + '" data-modus="dag" data-aan="' + (modus === "dag" ? 1 : 0) + '"' +
      (modus === "dag" ? ' style="background:var(--ink)"' : "") + ">Dag</button>" +
      '<button data-actie="' + actie + '" data-modus="week" data-aan="' + (modus === "week" ? 1 : 0) + '"' +
      (modus === "week" ? ' style="background:var(--ink)"' : "") + ">Week</button></div>";
    if (modus === "dag") {
      h += '<input type="date" data-actie="' + actie + '" data-veld="due" value="' + (due || "") + '">';
    } else {
      h += '<div class="weekkiezer">' +
        '<button data-actie="' + actie + '" data-weekstap="-1" aria-label="Week eerder">&lsaquo;</button>' +
        "<span>" + weekLang(week) + "</span>" +
        '<button data-actie="' + actie + '" data-weekstap="1" aria-label="Week later">&rsaquo;</button></div>';
    }
    return h;
  }

  /* ---------- tekenen ---------- */
  function teken() {
    document.getElementById("datum").textContent = langeDatum(vandaag());

    var nu = vandaag();
    var afVandaag = 0, openNu = 0;
    staat.tasks.forEach(function (t) {
      if (t.done && t.doneOn === nu) afVandaag++;
      else if (!t.done && ((t.due && dagenTussen(nu, t.due) <= 0) || (t.week && t.week < dezeWeek()))) openNu++;
    });
    var totaal = afVandaag + openNu;
    document.getElementById("voortgang").textContent =
      totaal === 0 ? "Niets op de planning voor vandaag" : afVandaag + " van " + totaal + " af";
    document.getElementById("balk").style.width = (totaal ? Math.round((afVandaag / totaal) * 100) : 0) + "%";
    var s = streak();
    var sEl = document.getElementById("streak");
    sEl.textContent = "🔥 " + s + (s === 1 ? " dag" : " dagen") + " op rij";
    sEl.className = "streak" + (s ? " aan" : "");

    var vak = document.getElementById("detailsvak");
    vak.hidden = !detailsOpen;
    if (detailsOpen) {
      vak.innerHTML = wanneerKiezer(nieuw.due, nieuw.week, "nieuw") + prioKnoppen(nieuw.prio, "nieuwprio") +
        '<input type="text" data-actie="nieuwcat" placeholder="Label, bv. school" value="' + esc(nieuw.cat) + '">';
    }

    var cats = [];
    staat.tasks.forEach(function (t) { if (t.cat && cats.indexOf(t.cat) === -1) cats.push(t.cat); });
    cats.sort();
    var chips = document.getElementById("chips");
    chips.innerHTML = cats.length
      ? '<button class="chip" data-actie="filter" data-cat="" data-aan="' + (filter === null ? 1 : 0) + '">Alles</button>' +
        cats.map(function (c) {
          return '<button class="chip" data-actie="filter" data-cat="' + esc(c) + '" data-aan="' + (filter === c ? 1 : 0) + '">' + esc(c) + "</button>";
        }).join("")
      : "";

    var zichtbaar = staat.tasks.filter(function (t) { return !filter || t.cat === filter; });
    var open = zichtbaar.filter(function (t) { return !t.done; });
    var af = zichtbaar.filter(function (t) { return t.done; });

    var h = "";
    if (!open.length && !af.length) {
      h = '<p class="leeg">Nog niets hier. Typ hierboven je eerste taak.</p>';
    }
    GROEPEN.forEach(function (g) {
      var items = open.filter(function (t) { return groepVan(t) === g.key; });
      if (!items.length) return;
      items.sort(function (a, b) {
        return PRIOS[a.prio].rang - PRIOS[b.prio].rang ||
          sorteerOp(a).localeCompare(sorteerOp(b)) || b.created - a.created;
      });
      h += '<section><h2 class="kop"' + (g.laat ? ' style="color:var(--alert)"' : "") + '><b>' + g.titel +
        "</b><span>" + items.length + "</span></h2>" + items.map(taakHtml).join("") + "</section>";
    });
    if (af.length) {
      af.sort(function (a, b) { return String(b.doneOn).localeCompare(String(a.doneOn)); });
      h += '<section><button class="kop" data-actie="toonaf" style="color:var(--muted)"><b>Afgevinkt</b><span>' +
        af.length + '</span><span class="rechts">' + (afOpen ? "verberg" : "toon") + "</span></button>" +
        (afOpen ? af.map(taakHtml).join("") : "") + "</section>";
    }
    document.getElementById("lijst").innerHTML = h;
  }

  function taakHtml(t) {
    var open = openId === t.id;
    var laat = isLaat(t);
    var subAf = t.subs.filter(function (s) { return s.done; }).length;

    var meta = [];
    if (t.due) meta.push('<span class="' + (laat ? "laat" : "") + '">' + korteDatum(t.due) + "</span>");
    if (t.week) meta.push('<span class="' + (laat ? "laat" : "") + '">' + weekKort(t.week) + "</span>");
    if (t.cat) meta.push("<span>" + esc(t.cat) + "</span>");
    if (t.subs.length) meta.push("<span>" + subAf + "/" + t.subs.length + " subtaken</span>");

    var h = '<div class="taak" data-id="' + t.id + '">' +
      '<div class="rij">' +
      '<i class="prio" style="background:' + (t.done ? "var(--line)" : PRIOS[t.prio].kleur) + '"></i>' +
      '<button class="vink" data-actie="vink" data-af="' + (t.done ? 1 : 0) + '" aria-label="Afvinken">' +
      (t.done ? VINK : "") + "</button>" +
      '<button class="titel" data-actie="open">' +
      '<span class="t" data-af="' + (t.done ? 1 : 0) + '">' + esc(t.title) + "</span>" +
      '<span class="meta">' + meta.join("") + "</span></button>" +
      '<span class="pijl">' + (open ? "▾" : "▸") + "</span></div>";

    if (open) {
      h += '<div class="paneel">' +
        '<input type="text" data-actie="titel" value="' + esc(t.title) + '">' +
        '<div class="veldrij">' + wanneerKiezer(t.due, t.week, "wanneer") + "</div>" +
        '<div class="veldrij">' + prioKnoppen(t.prio, "prio") +
        '<input type="text" data-actie="cat" placeholder="Label" value="' + esc(t.cat || "") + '"></div>' +
        "<div>" +
        t.subs.map(function (s) {
          return '<div class="sub" data-sub="' + s.id + '">' +
            '<button class="subvink" data-actie="subvink" data-af="' + (s.done ? 1 : 0) + '" aria-label="Subtaak afvinken">' +
            (s.done ? VINK_KLEIN : "") + "</button>" +
            '<span class="subtekst" data-af="' + (s.done ? 1 : 0) + '">' + esc(s.title) + "</span>" +
            '<button class="weg" data-actie="subweg" aria-label="Subtaak weg">' + PRULLENBAK + "</button></div>";
        }).join("") +
        '<div class="subtoe"><input type="text" data-actie="subnieuw" placeholder="Subtaak erbij" enterkeyhint="done">' +
        '<button data-actie="subtoe">Zet erbij</button></div></div>' +
        '<button class="verwijder" data-actie="taakweg">' + PRULLENBAK + " Taak verwijderen</button></div>";
    }
    return h + "</div>";
  }

  /* ---------- acties ---------- */
  function toevoegen() {
    var veld = document.getElementById("nieuw");
    var titel = veld.value.trim();
    if (!titel) return;
    staat.tasks.unshift({
      id: id(), title: titel, done: false, doneOn: null,
      due: nieuw.due || null, week: nieuw.week || null,
      prio: nieuw.prio, cat: nieuw.cat.trim() || null,
      subs: [], created: Date.now()
    });
    veld.value = "";
    nieuw = { due: "", week: null, prio: "normaal", cat: "" };
    bewaar(); teken();
  }

  document.getElementById("toevoegen").addEventListener("click", toevoegen);
  document.getElementById("nieuw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); toevoegen(); }
  });
  document.getElementById("meer").addEventListener("click", function () {
    detailsOpen = !detailsOpen;
    this.textContent = detailsOpen ? "Minder" : "Meer";
    teken();
  });

  document.body.addEventListener("click", function (e) {
    var el = e.target.closest("[data-actie]");
    if (!el) return;
    var actie = el.getAttribute("data-actie");
    var taakEl = el.closest("[data-id]");
    var t = taakEl ? taakVan(taakEl.getAttribute("data-id")) : null;

    if (actie === "nieuw") {
      if (el.getAttribute("data-modus") === "dag") { nieuw.week = null; }
      else if (el.getAttribute("data-modus") === "week") { nieuw.week = nieuw.week || dezeWeek(); nieuw.due = ""; }
      else if (el.hasAttribute("data-weekstap")) { nieuw.week = schuifWeek(nieuw.week, Number(el.getAttribute("data-weekstap"))); }
      else return;
      teken();
    } else if (actie === "nieuwprio") {
      nieuw.prio = el.getAttribute("data-prio"); teken();
    } else if (actie === "filter") {
      var c = el.getAttribute("data-cat");
      filter = !c ? null : (filter === c ? null : c);
      teken();
    } else if (actie === "toonaf") {
      afOpen = !afOpen; teken();
    } else if (actie === "vink" && t) {
      t.done = !t.done;
      t.doneOn = t.done ? vandaag() : null;
      if (t.done && staat.doneDates.indexOf(vandaag()) === -1) staat.doneDates.push(vandaag());
      bewaar(); teken();
    } else if (actie === "open" && t) {
      openId = openId === t.id ? null : t.id; teken();
    } else if (actie === "prio" && t) {
      t.prio = el.getAttribute("data-prio"); bewaar(); teken();
    } else if (actie === "wanneer" && t) {
      if (el.getAttribute("data-modus") === "dag") { t.week = null; }
      else if (el.getAttribute("data-modus") === "week") { t.week = t.week || dezeWeek(); t.due = null; }
      else if (el.hasAttribute("data-weekstap")) { t.week = schuifWeek(t.week, Number(el.getAttribute("data-weekstap"))); }
      else return;
      bewaar(); teken();
    } else if (actie === "subvink" && t) {
      var sid = el.closest("[data-sub]").getAttribute("data-sub");
      t.subs.forEach(function (s) { if (s.id === sid) s.done = !s.done; });
      bewaar(); teken();
    } else if (actie === "subweg" && t) {
      var wid = el.closest("[data-sub]").getAttribute("data-sub");
      t.subs = t.subs.filter(function (s) { return s.id !== wid; });
      bewaar(); teken();
    } else if (actie === "subtoe" && t) {
      var inp = taakEl.querySelector('[data-actie="subnieuw"]');
      if (inp && inp.value.trim()) { t.subs.push({ id: id(), title: inp.value.trim(), done: false }); bewaar(); teken(); }
    } else if (actie === "taakweg" && t) {
      staat.tasks = staat.tasks.filter(function (x) { return x.id !== t.id; });
      openId = null; bewaar(); teken();
    }
  });

  document.body.addEventListener("input", function (e) {
    var el = e.target.closest("[data-actie]");
    if (!el) return;
    var actie = el.getAttribute("data-actie");
    if (actie === "nieuwcat") { nieuw.cat = el.value; return; }
    var taakEl = el.closest("[data-id]");
    var t = taakEl ? taakVan(taakEl.getAttribute("data-id")) : null;
    if (!t) return;
    if (actie === "titel") { t.title = el.value; bewaar(); }
    else if (actie === "cat") { t.cat = el.value.trim() || null; bewaar(); }
    else if (actie === "wanneer" && el.getAttribute("data-veld") === "due") {
      t.due = el.value || null; t.week = null; bewaar(); teken();
    }
  });

  document.body.addEventListener("change", function (e) {
    var el = e.target.closest('[data-actie="nieuw"][data-veld="due"]');
    if (el) { nieuw.due = el.value; nieuw.week = null; }
  });

  document.body.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var el = e.target.closest('[data-actie="subnieuw"]');
    if (!el) return;
    e.preventDefault();
    var taakEl = el.closest("[data-id]");
    var t = taakVan(taakEl.getAttribute("data-id"));
    if (t && el.value.trim()) { t.subs.push({ id: id(), title: el.value.trim(), done: false }); bewaar(); teken(); }
  });

  // titel en label bijwerken zonder de rij opnieuw te tekenen; bij verlaten wel
  document.body.addEventListener("blur", function (e) {
    var el = e.target.closest('[data-actie="titel"], [data-actie="cat"]');
    if (el) teken();
  }, true);

  teken();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
